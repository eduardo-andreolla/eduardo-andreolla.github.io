<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ficha do Google | Eduardo Andreolla</title>
<meta name="description" content="Formulário para configurar a ficha da sua empresa no Google Meu Negócio.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a73e8">
<link rel="icon" href="../links/img/favicon-64.png">
<meta property="og:title" content="Ficha da sua empresa no Google">
<meta property="og:description" content="Responda algumas perguntas para eu criar e otimizar a ficha da sua empresa no Google Meu Negócio.">
<meta property="og:image" content="https://eduardoandreolla.com.br/links/img/eduardo.jpg">
<meta property="og:url" content="https://eduardoandreolla.com.br/ficha-google/">
<link rel="stylesheet" href="../formulario/motor.css">
</head>
<body>
<div class="app">
  <header>
    <div class="who">
      <div class="id"><div class="avatar" aria-hidden="true"></div><div><b>Eduardo Andreolla</b><small>Ficha da sua empresa no Google</small></div></div>
      <a class="help" id="ajuda" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg><span>Dúvida?</span></a>
    </div>
    <div class="progress" aria-hidden="true">
      <div class="bars"></div>
      <span class="stage" id="stage">Início</span>
    </div>
  </header>
  <main id="chat" aria-live="polite"></main>
  <footer id="composer"></footer>
</div>
<script src="../formulario/motor.js"></script>
<script>
const CATEGORIAS = ['Restaurante','Pizzaria','Lanchonete','Hamburgueria','Cafeteria','Padaria','Confeitaria','Sorveteria','Bar','Mercado','Açougue','Loja de roupas','Loja de calçados','Loja de presentes','Loja de móveis','Loja de materiais de construção','Ótica','Farmácia','Pet shop','Clínica veterinária','Academia','Estúdio de pilates','Salão de beleza','Barbearia','Clínica de estética','Centro de estética','Esteticista','Manicure','Clínica médica','Médico','Ginecologista','Cardiologista','Dermatologista','Dentista','Clínica odontológica','Nutricionista','Psicólogo','Fisioterapeuta','Advogado','Escritório de contabilidade','Imobiliária','Engenheiro civil','Arquiteto','Construtora','Oficina mecânica','Auto elétrica','Lava-jato','Loja de autopeças','Borracharia','Escola','Escola de idiomas','Agência de marketing','Gráfica','Fotógrafo','Serviço de buffet','Salão de festas','Hotel','Pousada','Distribuidora de gás','Loja de pisos e revestimentos','Vidraçaria','Serralheria','Marcenaria','Floricultura'];
const recebeNoLocal = a => a.modo !== 'Não recebe clientes no local (só online ou tele-entrega)';

const STAGES = ['Você', 'Empresa', 'Endereço', 'Atendimento', 'Estrutura', 'Fotos e contrato', 'Revisão'];

const passos = [
  { id: 'intro', stage: 0, nokey: true,
    say: () => ['Olá, seja bem-vindo! 👋', 'Este formulário reúne tudo o que eu preciso para criar e deixar completa a ficha da sua empresa no **Google Meu Negócio**. Leva uns 8 minutos.', { hint: 'Se digitar algo errado, no final você confere tudo e corrige antes de enviar. Se fechar a página, continua de onde parou.' }],
    input: { type: 'choice', options: ['Começar agora! 🚀'] } },

  ...P.contato(0),

  { id: 'tem_gmail', stage: 0, label: 'Tem e-mail do Google',
    say: () => ['Você tem um **e-mail do Google** (Gmail)?', { hint: 'É o e-mail que termina em @gmail.com.' }],
    input: { type: 'choice', options: SIM_NAO } },

  { id: 'gmail', stage: 0, label: 'E-mail do Google', when: a => a.tem_gmail === 'Sim',
    say: () => ['Qual é o seu **e-mail do Google**?'],
    input: { type: 'email' },
    after: async () => { await say('Perfeito! Eu crio a ficha e te adiciono como **proprietário** por esse e-mail. O Google te manda um convite, é só aceitar. 🔒'); await say({ hint: 'Você não precisa me passar senha nenhuma.' }); } },

  { id: 'm_sem_gmail', stage: 0, msg: true, when: a => a.tem_gmail === 'Não',
    say: () => ['Sem problema! Eu crio a ficha pelo meu e-mail e, quando você tiver um Gmail, passo a propriedade para você.'] },

  { id: 'ficha_existe', stage: 0, label: 'Já aparece no Google Maps',
    say: () => ['A sua empresa **já aparece no Google Maps**? (Mesmo que outra pessoa tenha criado.)', { hint: 'Se já existir, eu recupero a ficha em vez de criar outra. Ficha duplicada pode ser suspensa pelo Google.' }],
    input: { type: 'choice', options: ['Sim, já aparece', 'Não aparece', 'Não sei'] } },

  { id: 'ficha_link', stage: 0, label: 'Ficha que já existe', when: a => a.ficha_existe === 'Sim, já aparece',
    say: () => ['Se conseguir, cole aqui o **link da ficha** ou escreva o nome exato que aparece no Maps.'],
    input: { type: 'text', placeholder: 'Link ou nome no Google Maps', optional: 'Não sei' } },

  { id: 'm_empresa', stage: 1, msg: true, say: () => ['Agora vamos para as **informações da empresa**! 💼'] },

  ...P.cnpj(1),

  P.nomeEmpresa(1, 'É o nome da fachada. O Google não deixa colocar cidade nem palavras extras no nome, senão suspende a ficha.'),

  { id: 'categoria', stage: 1, label: 'Categoria principal',
    say: a => ['Qual é a **categoria principal** do seu negócio?', { hint: a._cnpj && a._cnpj.atividade ? `Na Receita, a atividade está como "${titleCase(a._cnpj.atividade)}". Escreva com as suas palavras o que vocês são.` : 'Exemplo: restaurante, loja de roupas, academia, clínica médica.' }],
    input: { type: 'text', placeholder: 'Comece a digitar...', list: CATEGORIAS } },

  { id: 'data_abertura', stage: 1, label: 'Data de abertura',
    say: () => ['Qual é a **data de abertura** da empresa?', { hint: 'Pode ser aproximada, se não lembrar a exata.' }],
    input: { type: 'date', max: today }, show: fmtDate },

  { id: 'whats_emp', stage: 1, label: 'WhatsApp da empresa',
    say: () => ['Qual é o **WhatsApp da empresa**? É o número que vai aparecer na ficha.'],
    input: { type: 'phone', chips: a => a.whats ? [{ label: 'É o mesmo do meu', value: a.whats }] : [] } },

  { id: 'instagram', stage: 1, label: 'Instagram',
    say: () => ['Qual é o **Instagram da empresa**?', { hint: 'Exemplo: @eduardoandreolla_' }],
    input: { type: 'instagram', placeholder: '@usuario', chips: () => [{ label: 'Não tem Instagram', value: 'Não tem' }] } },

  { id: 'site', stage: 1, label: 'Site',
    say: () => ['A empresa tem **site**? Se tiver, digite o endereço.'],
    input: { type: 'site', placeholder: 'www.suaempresa.com.br', chips: () => [{ label: 'Não tem site', value: 'Não tem' }] } },

  { id: 'm_endereco', stage: 2, msg: true, say: () => ['Agora o **endereço** da empresa 📍'] },

  { id: 'end_cnpj_ok', stage: 2, label: 'Endereço igual ao do CNPJ',
    when: a => a._cnpj && a.cnpj_ok === 'Sim, é essa' && a._cnpj.cep,
    say: a => { const c = a._cnpj; return ['O atendimento é **neste endereço**, que está no CNPJ?', { card: esc(`${c.rua}, ${c.numero}${c.complemento ? ' - ' + c.complemento : ''}\n${c.bairro} · ${c.cidade}/${c.uf}\nCEP ${c.cep}`).replace(/\n/g, '<br>') }]; },
    input: { type: 'choice', options: ['Sim, é esse', 'Não, é outro'] },
    after: async (v, a) => {
      if (v !== 'Sim, é esse') return;
      const c = a._cnpj, m = { cep: c.cep, rua: c.rua, numero: c.numero, complemento: c.complemento || 'Não tem', bairro: c.bairro, cidade: c.cidade, uf: c.uf };
      Object.entries(m).forEach(([k, x]) => { if (x) { a[k] = x; a._pre = (a._pre || []).concat(k); } });
    } },

  { id: 'cep', stage: 2, label: 'CEP',
    say: () => ['Qual é o **CEP**?', { hint: 'Com o CEP eu já preencho a rua, o bairro e a cidade.' }],
    input: { type: 'cep', chips: () => [{ label: 'Não sei o CEP', value: 'Não sei' }] },
    after: async (v, a) => {
      ['rua', 'bairro', 'cidade', 'uf'].forEach(k => delete a[k]);
      if (digits(v).length !== 8) return;
      const d = await getJSON(`https://viacep.com.br/ws/${digits(v)}/json/`);
      if (!d || d.erro) { await say({ hint: 'Não achei esse CEP. Vou perguntar o endereço por partes.' }); return; }
      if (d.logradouro) a.rua = d.logradouro;
      if (d.bairro) a.bairro = d.bairro;
      if (d.localidade) a.cidade = d.localidade;
      if (d.uf) a.uf = d.uf;
      await say(`Achei: ${[d.logradouro, d.bairro, d.localidade + '/' + d.uf].filter(Boolean).join(', ')} ✅`);
    } },

  { id: 'rua', stage: 2, label: 'Rua', say: () => ['Qual é o **nome da rua**?'], input: { type: 'text', placeholder: 'Rua, avenida...' } },
  { id: 'numero', stage: 2, label: 'Número', say: () => ['Qual é o **número**?'], input: { type: 'text', inputmode: 'numeric', placeholder: 'Número', chips: () => [{ label: 'Sem número', value: 'S/N' }] } },
  { id: 'complemento', stage: 2, label: 'Complemento', say: () => ['Tem **complemento**? (sala, andar, loja...)'], input: { type: 'text', placeholder: 'Ex.: Sala 401', optional: 'Não tem' } },
  { id: 'bairro', stage: 2, label: 'Bairro', say: () => ['Qual é o **bairro**?'], input: { type: 'text', placeholder: 'Bairro' } },
  { id: 'cidade', stage: 2, label: 'Cidade', say: () => ['Qual é a **cidade**?'], input: { type: 'text', placeholder: 'Cidade' } },
  { id: 'uf', stage: 2, label: 'Estado', say: () => ['Qual é o **estado**?'], input: { type: 'select', options: Object.entries(UFS).map(([k, n]) => ({ value: k, label: n })), def: 'RS' }, show: v => UFS[v] || v },

  { id: 'referencia', stage: 2, label: 'Pontos de referência',
    say: () => ['Tem algum **ponto de referência** que ajude o cliente a chegar?', { hint: 'Exemplo: ao lado do posto Ipiranga, dentro do Centro Clínico do Hospital.' }],
    input: { type: 'text', placeholder: 'Ponto de referência', optional: 'Não tem' } },

  { id: 'm_atend', stage: 3, msg: true, say: () => ['Agora vamos para o **atendimento** da empresa! 🕒'] },

  { id: 'horarios', stage: 3, label: 'Horário de funcionamento',
    say: () => ['Quais são os **dias e horários de funcionamento**?', { hint: 'Marque os dias abertos e ajuste os horários. Se fecha para o almoço, use "+ intervalo".' }],
    input: { type: 'hours' } },

  { id: 'pagamentos', stage: 3, label: 'Formas de pagamento',
    say: () => ['Quais **formas de pagamento** a empresa aceita?', { hint: 'Pode marcar mais de uma.' }],
    input: { type: 'multi', options: ['Pix', 'Dinheiro', 'Cartão de crédito', 'Cartão de débito', 'Pagamento por aproximação', 'Boleto', 'Cheque', 'Vale-refeição ou alimentação'] } },

  { id: 'modo', stage: 3, label: 'Como atende',
    say: () => ['A empresa **recebe clientes no local** ou só com agendamento?'],
    input: { type: 'choice', options: ['Recebe no local, sem precisar agendar', 'Recebe no local, só com horário marcado', 'Não recebe clientes no local (só online ou tele-entrega)'] } },

  { id: 'area', stage: 3, label: 'Onde atende',
    say: () => ['A empresa atende **só na sua cidade** ou também em **outras cidades**?'],
    input: { type: 'choice', options: ['Só na nossa cidade', 'Também em outras cidades'] } },

  { id: 'outras_cidades', stage: 3, label: 'Outras cidades atendidas', when: a => a.area === 'Também em outras cidades',
    say: () => ['Quais **outras cidades** a empresa atende?'],
    input: { type: 'textarea', placeholder: 'Ex.: Passo Fundo, Marau, Erechim' } },

  { id: 'entrega', stage: 3, label: 'Entrega e frete grátis',
    say: () => ['A empresa faz **entrega**? Tem **frete grátis** em alguma condição?'],
    input: { type: 'choice', options: ['Entrega com frete grátis em alguma condição', 'Entrega, mas sem frete grátis', 'Não faz entrega'] } },

  { id: 'frete_cond', stage: 3, label: 'Condição do frete grátis', when: a => a.entrega === 'Entrega com frete grátis em alguma condição',
    say: () => ['Qual é a **condição** para o frete grátis?', { hint: 'Exemplo: compras acima de R$ 100,00 em Passo Fundo.' }],
    input: { type: 'text', placeholder: 'Condição do frete grátis' } },

  { id: 'servicos', stage: 3, label: 'Serviços e produtos',
    say: () => ['Quais **serviços ou produtos** a empresa oferece?', { hint: 'Um por linha. Quanto mais detalhes, mais buscas a ficha aparece. Se quiser, coloque o preço ao lado.' }],
    input: { type: 'textarea', placeholder: 'Ex.:\nTroca de óleo\nAlinhamento e balanceamento\nRevisão completa', min: 3 } },

  { id: 'descricao', stage: 3, label: 'Descrição da empresa',
    say: () => ['**Descreva a sua empresa** e o que a torna única.', { hint: 'A história, o que vocês fazem, para quem, e o diferencial em relação à concorrência. Exemplo: "Estamos há mais de 20 anos vendendo produtos agrícolas, com atendimento qualificado, entrega rápida e garantia em tudo."' }],
    input: { type: 'textarea', placeholder: 'Conte sobre a empresa...', min: 20, counter: true } },

  { id: 'descricao_mais', stage: 3, nolabel: true, when: a => (a.descricao || '').length < 150,
    say: () => ['Ficou bem curtinho! 😅 Quer contar mais alguma coisa? Diferenciais, tempo de mercado, quem atende... Com mais detalhes eu escrevo uma descrição bem melhor.'],
    input: { type: 'choice', options: ['Quero acrescentar', 'Pode seguir assim'] } },

  { id: 'descricao_extra', stage: 3, nolabel: true, when: a => a.descricao_mais === 'Quero acrescentar',
    say: () => ['Pode escrever! 👇'],
    input: { type: 'textarea', placeholder: 'Mais sobre a empresa...' },
    after: (v, a) => { a.descricao = (a.descricao + '\n' + v).trim(); } },

  { id: 'mulheres', stage: 3, label: 'Empresa de mulheres',
    say: () => ['A empresa é de **propriedade de mulheres** ou liderada por mulheres?', { hint: 'Se for, aparece um selo na ficha do Google.' }],
    input: { type: 'choice', options: SIM_NAO } },

  { id: 'm_estrutura', stage: 4, msg: true, when: recebeNoLocal, say: () => ['Agora a **estrutura do local**! 🏢'] },

  { id: 'banheiro', stage: 4, label: 'Banheiro para clientes', when: recebeNoLocal,
    say: () => ['O local tem **banheiro** que o cliente pode usar?'], input: { type: 'choice', options: SIM_NAO } },

  { id: 'acessivel', stage: 4, label: 'Acessibilidade', when: recebeNoLocal,
    say: () => ['O local tem **acessibilidade para cadeirantes**?', { hint: 'Pode marcar mais de uma.' }],
    input: { type: 'multi', options: ['Entrada acessível', 'Banheiro acessível', 'Estacionamento acessível', 'Elevador'], none: 'Não tem acessibilidade' } },

  { id: 'estacionamento', stage: 4, label: 'Estacionamento', when: recebeNoLocal,
    say: () => ['O local tem **estacionamento**?', { hint: 'Pode marcar mais de uma.' }],
    input: { type: 'multi', options: ['Gratuito na rua', 'Pago na rua', 'Privativo gratuito', 'Privativo pago'], none: 'Não tem estacionamento' } },

  { id: 'wifi', stage: 4, label: 'Wi-Fi para clientes', when: recebeNoLocal,
    say: () => ['Tem **Wi-Fi** para os clientes?'], input: { type: 'choice', options: ['Sim, gratuito', 'Sim, pago', 'Não tem'] } },

  ...P.arquivos(5, { fotosTexto: 'Agora as **fotos** que vão para a ficha: fachada (de dia, de frente), ambiente por dentro, equipe trabalhando, produtos ou serviços. 📸' }),
  ...P.contrato(5),
  P.revisao(6)
];

function fichaMarkdown() {
  const cell = v => String(v == null || v === '' ? '-' : v).replace(/\|/g, '/').replace(/\n/g, '<br>');
  const v = k => { const s = STEPS.find(x => x.key === k); return s && visible(s) && A[k] !== undefined ? showVal(s, A[k]) : '-'; };
  const tab = rows => { const [h, ...r] = rows; return `| ${h[0]} | ${cell(h[1])} |\n| ---| --- |\n` + r.map(x => `| ${x[0]} | ${cell(x[1])} |`).join('\n') + '\n'; };
  return `## Informações do cliente\n\n#### Informações básicas de contato\n\n` + tab([
    ['Nome completo', v('nome')], ['CPF', v('cpf')], ['WhatsApp pessoal (colocar o DDD)', v('whats')],
    ['Conta do G-mail (e-mail do Google)', A.tem_gmail === 'Sim' ? v('gmail') : 'Não tem'], ['Já aparece no Google Maps', v('ficha_existe') + (A.ficha_link ? ' — ' + A.ficha_link : '')]]) +
  `\n#### Informações da empresa\n\n` + tab([
    ['Nome da empresa', v('nome_empresa')], ['Categoria principal', v('categoria')], ['CNPJ', A.tem_cnpj === 'Sim' ? v('cnpj') : 'Não tem'],
    ['Razão social', A._cnpj ? A._cnpj.razao : '-'], ['Data de abertura da empresa', v('data_abertura')], ['WhatsApp da empresa (colocar o DDD)', v('whats_emp')],
    ['Instagram da empresa (nome do usuário)', v('instagram')], ['Site', v('site')], ['Rua', v('rua')], ['Número', v('numero')], ['Complemento', v('complemento')],
    ['Bairro', v('bairro')], ['Cidade', v('cidade')], ['CEP', v('cep')], ['Estado', v('uf')], ['Pontos de referência do local', v('referencia')]]) +
  `\n#### Informações sobre o atendimento da empresa\n\n` + tab([
    ['Dias e horários de funcionamento', v('horarios')], ['Quais são as formas de pagamento?', v('pagamentos')],
    ['Entrega e frete grátis', v('entrega') + (A.frete_cond && v('frete_cond') !== '-' ? ' — ' + A.frete_cond : '')],
    ['Recebe clientes no local ou somente por agendamento?', v('modo')],
    ['A empresa atende somente na cidade onde é localizada ou também em outras cidades?', v('area') + (v('outras_cidades') !== '-' ? ': ' + A.outras_cidades : '')],
    ['Quais serviços são oferecidos pela empresa?', v('servicos')], ['Uma breve descrição sobre a empresa', v('descricao')], ['Empresa de mulheres', v('mulheres')]]) +
  `\n#### Informações sobre a estrutura da empresa\n\n` + tab([
    ['Banheiro para clientes', v('banheiro')], ['Acessibilidade', v('acessivel')], ['Estacionamento', v('estacionamento')], ['Wi-Fi', v('wifi')]]) +
  `\n#### Fotos e logotipo\n\n` + tab([['Logotipo', v('logo')], ['Fotos', v('fotos')]]) +
  `\n#### Contrato\n\n` + tab([['Condição de pagamento', v('pag_contrato') + (A.parcelas && A.pag_contrato === 'Parcelado' ? ' em ' + A.parcelas : '')], ['Vencimento', v('vencimento')]]);
}

iniciar({
  tipo: 'gmn',
  documento: 'Ficha GMN',
  storage: 'ficha-gmn-v1',
  stages: STAGES,
  steps: passos,
  markdown: fichaMarkdown,
  privacidade: 'Seus dados são usados só para criar e cuidar da ficha da sua empresa e para o contrato.',
  fim: () => ['Recebi tudo. Com essas informações eu configuro e otimizo a ficha da sua empresa no **Google Meu Negócio**, e te chamo assim que estiver pronta.']
});
</script>
</body>
</html>
